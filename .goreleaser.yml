version: 2
before:
  hooks:
    - go mod download
    - go mod tidy
builds:
  -
    id: agysession-darwin
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/hagatasdelus/agysession/version.Revision={{.ShortCommit}}
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
  -
    id: agysession-windows
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/hagatasdelus/agysession/version.Revision={{.ShortCommit}}
    env:
      - CGO_ENABLED=0
    goos:
      - windows
    goarch:
      - amd64
  -
    id: agysession-linux
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/hagatasdelus/agysession/version.Revision={{.ShortCommit}}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
archives:
  -
    id: agysession-archive
    name_template: '{{ .ProjectName }}_v{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}'
    format_overrides:
      - goos: darwin
        formats:
          - zip
    files:
      - LICENSE
      - CREDITS
      - README.md
checksum:
  name_template: 'checksums.txt'
changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
release:
  use_existing_draft: true
